<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>News Chat (Debug UI)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            margin: 24px;
        }

        .row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            height: 90px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }

        .bullet {
            margin-left: 18px;
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        .muted {
            color: #666;
        }

        .error {
            color: #b00020;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <h1>News Chat — Debug UI</h1>
    <div class="row">
        <label for="style">Style:</label>
        <select id="style">
            <option value="bullets" selected>bullets</option>
            <option value="paragraph">paragraph</option>
        </select>
        <label for="k">Top K:</label>
        <input id="k" type="number" min="1" max="8" value="6" style="width:60px" />
        <button id="ask">Ask</button>
    </div>
    <textarea id="q" placeholder="Ask about the dataset… e.g., What are the AI themes for NVDA and MSFT?"></textarea>

    <h3>Answer</h3>
    <div id="answer" class="mono"></div>

    <div class="muted" style="margin-top:16px;">
        Tip: The API is at <code class="mono">/api/ask</code>. Health: <code class="mono">/api/health</code>.
    </div>

    <script>
        const $ = (id) => document.getElementById(id);

        async function ask() {
            const query = $('q').value.trim();
            const style = $('style').value;
            const k = Number($('k').value) || 6;

            $('answer').textContent = '';

            if (!query) return;

            try {
                const res = await fetch('/api/ask', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ query, style, k })
                });

                const data = await res.json();
                if (!res.ok || !data.ok) {
                    $('answer').innerHTML = '<div class="error">' + (data.error || res.statusText) + '</div>';
                    return;
                }

                if (data.style === 'bullets' && Array.isArray(data.bullets)) {
                    $('answer').innerHTML = data.bullets.map(b => `<div class="bullet">• ${b}</div>`).join('');
                } else if (data.style === 'paragraph' && data.answer) {
                    $('answer').textContent = data.answer;
                } else {
                    $('answer').textContent = '(No answer)';
                }

                const used = data.usedDocIds || [];
            } catch (e) {
                $('answer').innerHTML = '<div class="error">' + (e && e.message || String(e)) + '</div>';
            }
        }

        $('ask').addEventListener('click', ask);
        $('q').addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') ask();
        });
    </script>
</body>

</html>
